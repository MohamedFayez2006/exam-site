<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الامتحان</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wrap{max-width:760px;margin:0 auto;padding:16px}
.panel{margin-bottom:16px}
.panel input{margin-bottom:14px}
.bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-bottom:2px solid var(--accent);padding:10px 16px}
#timer{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
#timer.low{color:var(--danger)}
.q{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px;user-select:none}
.q .b{font-weight:600;margin-bottom:10px;white-space:pre-wrap}
.q label{display:flex;gap:10px;align-items:center;font-weight:400;padding:8px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer}
.q input[type=radio]{width:auto;margin:0}
textarea{width:100%;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px;user-select:text}
h3{margin:22px 0 10px;color:var(--muted)}
#warn{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.92);display:grid;place-items:center;padding:20px;text-align:center;color:#fff}
#warn div{max-width:420px}
#warn p{font-size:1.15rem}
#warn button{width:auto;padding:10px 24px}
.small{color:var(--muted);font-size:.9rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="intro" hidden>
  <h1 id="eTitle"></h1>
  <p id="eInfo" class="small"></p>
  <div class="panel" id="eInstr" style="white-space:pre-wrap"></div>
  <form class="panel" id="vForm">
    <p class="small">اكتب اسمك وصفّك زي المسجلين عندنا. الامتحان هيشتغل بملء الشاشة، وأي خروج منه أو تغيير تبويب أو تحديث للصفحة بيتسجل كمخالفة.</p>
    <label for="vName">الاسم الكامل</label><input id="vName" required>
    <label for="vGrade">الصف</label><input id="vGrade" required>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="agree" style="width:auto;margin:0" required> أوافق على الشروط</label>
    <button type="submit" style="margin-top:14px">ابدأ الامتحان</button>
    <p class="msg" id="vMsg" role="alert"></p>
  </form>
  <a href="student.html">الرجوع للقائمة</a>
</div>

<div id="exam" hidden>
  <div class="bar"><span id="eName"></span><span id="save" class="small"></span><span id="timer">--:--</span></div>
  <div class="wrap">
    <div id="qs"></div>
    <button id="submit">تسليم الامتحان</button>
  </div>
</div>

<div class="wrap" id="end" hidden>
  <h1 id="endT"></h1><p id="endP"></p><a class="btn" href="student.html">الرجوع للقائمة</a>
</div>

<div id="warn" hidden><div><p id="warnT"></p><button id="warnB">رجوع للامتحان</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="js/app.js"></script>
<script>
const examId = new URLSearchParams(location.search).get("e");
const device = sessionStorage.dev || (sessionStorage.dev = crypto.randomUUID());
const gr = (v) => { const t = norm(v); return /(1|١|اول)/.test(t) ? "1" : /(2|٢|تان|ثان)/.test(t) ? "2" : t; };
const norm = (s) => String(s ?? "").replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim().toLowerCase();
const ERR = { exam_closed: "الامتحان مقفول حاليًا.", no_attempts_left: "استنفدت محاولتك. محتاج موافقة المشرف على محاولة إضافية.", time_over: "انتهى وقت الامتحان وتم تسليم إجاباتك.", exam_not_available: "الامتحان غير متاح.", not_allowed: "حسابك غير مفعّل لهذا الامتحان." };
let me, exam, att, token, expAt = 0, active = false, lastV = 0, pending = {}, timerIv, hbIv, saveT;
const show2 = (id) => ["intro", "exam", "end"].forEach((s) => ($("#" + s).hidden = s !== id));

function rng(seed) { let h = 0; for (const c of seed) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
  return () => { h = (h + 0x6D2B79F5) | 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const shuffle = (a, r) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

(async () => {
  me = await requireRole("student");
  if (!me) return;
  const { data, error } = await sb.from("exams").select("*").eq("id", examId).eq("is_published", true).single();
  if (error || !data) return finish("gone");
  exam = data;
  $("#eTitle").textContent = exam.title;
  $("#eName").textContent = exam.title;
  $("#eInfo").textContent = `المدة ${exam.duration_minutes} دقيقة — المخالفات المسموحة ${exam.max_violations}`;
  $("#eInstr").textContent = exam.instructions || "";
  show2("intro");
})();

$("#vForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("#vMsg");
  if (norm($("#vName").value) !== norm(me.full_name) || gr($("#vGrade").value) !== gr(me.grade))
    return show(msg, "البيانات مش مطابقة لسجلك. راجع الاسم والصف.");
  if (document.fullscreenEnabled) { try { await document.documentElement.requestFullscreen(); } catch {} 
    if (!document.fullscreenElement) return show(msg, "لازم تسمح بملء الشاشة عشان تبدأ."); }
  show(msg, "جاري البدء...", true);
  const { data, error } = await sb.rpc("start_attempt", { p_exam_id: examId, p_device: device });
  if (error) { if (document.fullscreenElement) document.exitFullscreen(); const k = Object.keys(ERR).find((x) => error.message.includes(x)); return show(msg, ERR[k] || "تعذر البدء: " + error.message); }
  att = data;
  token = (await sb.auth.getSession()).data.session?.access_token;
  const [qs, saved, hb] = await Promise.all([
    sb.from("questions").select("id,type,body,options,points,position").eq("exam_id", examId).order("position"),
    sb.rpc("my_answers", { p_attempt: att }),
    sb.rpc("heartbeat", { p_attempt: att, p_device: device }),
  ]);
  if (qs.error || hb.error) return show(msg, "تعذر تحميل الأسئلة.");
  expAt = Date.now() + hb.data.remaining * 1000;
  render(qs.data, Object.fromEntries((saved.data || []).map((a) => [a.question_id, a.answer])));
  show2("exam"); active = true;
  timerIv = setInterval(tick, 1000); hbIv = setInterval(beat, 15000); tick();
});

function render(list, saved) {
  const r = rng(att), groups = [["tf", "أسئلة صح وغلط"], ["mcq", "أسئلة اختيار من متعدد"], ["essay", "أسئلة مقالية"]];
  let n = 0, html = "";
  for (const [t, title] of groups) {
    let items = list.filter((q) => q.type === t);
    if (!items.length) continue;
    if (exam.shuffle) items = shuffle(items, r);
    html += `<h3>${title}</h3>`;
    for (const q of items) {
      n++; const v = saved[q.id] ?? "";
      let body = "";
      if (t === "tf") body = [["true", "صح"], ["false", "غلط"]].map(([val, l]) => `<label><input type="radio" name="${q.id}" value="${val}" ${v === val ? "checked" : ""}>${l}</label>`).join("");
      if (t === "mcq") body = (exam.shuffle ? shuffle(q.options, r) : q.options).map((o) => `<label><input type="radio" name="${q.id}" value="${esc(o)}" ${v === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("");
      if (t === "essay") body = `<textarea rows="6" maxlength="5000" data-q="${q.id}">${esc(v)}</textarea>`;
      html += `<div class="q"><div class="b">${n}. ${esc(q.body)} <span class="small">(${q.points} درجة)</span></div>${body}</div>`;
    }
  }
  $("#qs").innerHTML = html;
}
$("#qs").addEventListener("change", (e) => e.target.type === "radio" && queue(e.target.name, e.target.value));
$("#qs").addEventListener("input", (e) => e.target.dataset.q && queue(e.target.dataset.q, e.target.value));
function queue(q, v) { pending[q] = v; $("#save").textContent = "..."; clearTimeout(saveT); saveT = setTimeout(flush, 700); }
async function flush() {
  for (const [q, v] of Object.entries(pending)) {
    const { error } = await sb.rpc("save_answer", { p_attempt: att, p_question: q, p_answer: v, p_device: device });
    if (!error) { if (pending[q] === v) delete pending[q]; }
    else if (/other_device/.test(error.message)) return finish("other");
    else if (/time_over|not_active/.test(error.message)) return finish("submitted");
  }
  $("#save").textContent = Object.keys(pending).length ? "في انتظار الاتصال..." : "تم الحفظ ✓";
}
async function beat() {
  if (!active) return;
  await flush();
  const { data: s } = await sb.auth.getSession(); token = s.session?.access_token;
  const { data, error } = await sb.rpc("heartbeat", { p_attempt: att, p_device: device });
  if (error) return /other_device/.test(error.message) ? finish("other") : null;
  expAt = Date.now() + data.remaining * 1000;
  if (data.status !== "in_progress") finish(data.status);
}
function tick() {
  const s = Math.max(0, Math.round((expAt - Date.now()) / 1000));
  $("#timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  $("#timer").classList.toggle("low", s < 300);
  if (s === 0 && active) doSubmit();
}
async function doSubmit() { active = false; await flush(); await sb.rpc("submit_attempt", { p_attempt: att }); finish("submitted"); }
$("#submit").addEventListener("click", () => confirm("تسليم الامتحان نهائيًا؟") && doSubmit());

function finish(status) {
  active = false; clearInterval(timerIv); clearInterval(hbIv);
  if (document.fullscreenElement) document.exitFullscreen();
  $("#warn").hidden = true;
  const m = { submitted: ["تم تسليم الامتحان", "إجاباتك اتسجلت وتم تسليم الامتحان."], locked: ["تم إنهاء الامتحان", "اتقفل الامتحان بسبب تجاوز عدد المخالفات، وتم تسليم إجاباتك لحد اللحظة دي."], other: ["الامتحان اتفتح من جهاز تاني", "المحاولة دي بتكمل من الجهاز الأحدث بس."], gone: ["الامتحان غير متاح", "رجّع للقائمة."] }[status] || ["انتهى الامتحان", ""];
  $("#endT").textContent = m[0]; $("#endP").textContent = m[1]; show2("end");
}

/* ---------- كشف المخالفات ---------- */
async function violate(type) {
  if (!active) return;
  const now = Date.now(); if (now - lastV < 2500) return; lastV = now;
  const { data, error } = await sb.rpc("log_violation", { p_attempt: att, p_type: type, p_device: device });
  if (error) { if (/other_device/.test(error.message)) return finish("other"); return warn("تعذر تسجيل المخالفة بسبب الاتصال. ارجع للامتحان فورًا."); }
  if (data.locked) return finish("locked");
  warn(`تحذير: مخالفة ${data.count} من ${data.max}. ارجع للامتحان فورًا، وتجاوز الحد بينهي الامتحان.`);
}
function warn(t) { $("#warnT").textContent = t; $("#warn").hidden = false; }
$("#warnB").addEventListener("click", async () => { $("#warn").hidden = true; try { if (document.fullscreenEnabled) await document.documentElement.requestFullscreen(); } catch {} });
document.addEventListener("visibilitychange", () => document.hidden && violate("tab_hidden"));
addEventListener("blur", () => violate("window_blur"));
document.addEventListener("fullscreenchange", () => !document.fullscreenElement && violate("fullscreen_exit"));
["copy", "cut", "paste", "contextmenu", "dragstart"].forEach((ev) => document.addEventListener(ev, (x) => active && x.preventDefault()));
addEventListener("keydown", (e) => {
  if (!active) return; const k = e.key.toLowerCase();
  if (e.key === "F12" || (e.ctrlKey && e.shiftKey && "ijc".includes(k)) || (e.ctrlKey && ["s", "u", "p"].includes(k))) e.preventDefault();
});
addEventListener("pagehide", () => {
  if (!active || !token) return;
  fetch(`${SUPABASE_URL}/rest/v1/rpc/log_violation`, { method: "POST", keepalive: true,
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ p_attempt: att, p_type: "page_left", p_device: device }) });
});
</script>
</body>
</html>
