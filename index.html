<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | منصة الامتحانات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="login">
      <h1>دخول الامتحان</h1>
      <p class="sub">اكتب اسم المستخدم ورقم الجلوس اللي استلمتهم من المشرف.</p>

      <form class="panel" id="form" novalidate>
        <label for="username">اسم المستخدم</label>
        <input id="username" autocomplete="username" autocapitalize="none"
               spellcheck="false" dir="ltr" required>

        <label for="password">رقم الجلوس</label>
        <input id="password" type="password" autocomplete="current-password"
               dir="ltr" required>

        <button id="submit" type="submit">دخول</button>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");
    const BAD = "بيانات الدخول غير صحيحة. راجع الاسم ورقم الجلوس.";

    // لو في جلسة شغالة، حوّله للصفحة المناسبة لدوره
    async function route() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return false;
      const { data: p } = await sb.from("profiles")
        .select("role").eq("id", session.user.id).single();
      if (!p) { await sb.auth.signOut(); return false; }
      location.replace(p.role === "admin" ? "admin.html" : "student.html");
      return true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      const u = document.getElementById("username").value.trim();
      const pw = document.getElementById("password").value;
      if (!u || !pw) { msg.textContent = "اكتب اسم المستخدم ورقم الجلوس."; return; }

      btn.disabled = true;
      btn.textContent = "جاري الدخول...";

      // الأدمن بيدخل بإيميله وباسورده، والطالب باسم المستخدم ورقم الجلوس
      const isEmail = u.includes("@");
      const { error } = await sb.auth.signInWithPassword({
        email: isEmail ? u : `${u.toLowerCase()}@${EMAIL_DOMAIN}`,
        password: isEmail ? pw : PASSWORD_PREFIX + pw.trim(),
      });

      if (error || !(await route())) {
        msg.textContent = BAD;
        btn.disabled = false;
        btn.textContent = "دخول";
      }
    });

    route();
  </script>
</body>
</html>
